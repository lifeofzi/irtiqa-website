<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRTIQA — Ali Saffudin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Mono:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--red:#c00000;--bright:#ff2222;--dim:#600000;--black:#050505;--white:#f0f0f0}
    html{scroll-behavior:smooth}
    body{background:var(--black);color:var(--white);font-family:'Oswald',Impact,'Arial Narrow',sans-serif;overflow-x:hidden}

    .scanlines{position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px)}
    .vignette{position:fixed;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.82) 100%)}

    /* HERO */
    .hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px 60px;overflow:hidden}
    .hero-bg{position:absolute;inset:0;z-index:0;background:url('./public/cover.jpg') center 30%/cover no-repeat;filter:blur(45px) brightness(.07) saturate(.2);transform:scale(1.18)}
    .hero-resist{position:absolute;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
    .hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center}

    .title-row{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center;animation:fadeDown 1.1s cubic-bezier(.22,1,.36,1) both}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:translateY(0)}}
    .title-en{font-weight:700;font-size:clamp(60px,14vw,152px);color:var(--red);letter-spacing:.07em;line-height:1;text-transform:uppercase;position:relative;display:inline-block;text-shadow:0 0 50px rgba(192,0,0,.45)}
    .g-a,.g-b{position:absolute;inset:0;display:inline-block;width:100%;font-weight:inherit;font-size:inherit;letter-spacing:inherit;text-shadow:none}
    .g-a{color:#ff4444;clip-path:polygon(0 25%,100% 25%,100% 48%,0 48%);animation:ga 5s infinite}
    .g-b{color:#770000;clip-path:polygon(0 60%,100% 60%,100% 82%,0 82%);animation:gb 5s infinite}
    @keyframes ga{0%,87%,100%{transform:translateX(0);opacity:0}89%{transform:translateX(-5px);opacity:1}91%{transform:translateX(4px);opacity:1}93%{transform:translateX(-2px);opacity:1}95%{transform:translateX(0);opacity:0}}
    @keyframes gb{0%,80%,100%{transform:translateX(0);opacity:0}82%{transform:translateX(6px);opacity:.8}84%{transform:translateX(-4px);opacity:.8}86%{transform:translateX(0);opacity:0}}

    .title-ar{font-family:'Amiri','Traditional Arabic',serif;font-weight:700;font-size:clamp(44px,10vw,108px);color:var(--red);direction:rtl;text-shadow:0 0 50px rgba(192,0,0,.45);animation:fadeRight 1.4s .4s cubic-bezier(.22,1,.36,1) both}
    @keyframes fadeRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
    .hairline{width:0;height:1px;margin:28px 0;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:grow 1.6s .8s ease both}
    @keyframes grow{to{width:140px}}
    .cover-outer{position:relative;animation:riseIn 1.5s .3s cubic-bezier(.22,1,.36,1) both}
    @keyframes riseIn{from{opacity:0;transform:translateY(50px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
    .cover-glow{position:absolute;inset:-50px;pointer-events:none;background:radial-gradient(ellipse,rgba(180,0,0,.38) 0%,transparent 70%);animation:glowPulse 3.2s ease-in-out infinite}
    @keyframes glowPulse{0%,100%{opacity:.5;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
    .cover-frame{position:relative;padding:2px;background:linear-gradient(135deg,var(--bright),var(--dim),var(--red))}
    .cover-img{display:block;width:min(360px,80vw);height:min(360px,80vw);object-fit:cover;filter:grayscale(15%) contrast(1.08)}
    .c{position:absolute;width:18px;height:18px;border-color:var(--bright);border-style:solid}
    .c-tl{top:-8px;left:-8px;border-width:2px 0 0 2px}.c-tr{top:-8px;right:-8px;border-width:2px 2px 0 0}
    .c-bl{bottom:-8px;left:-8px;border-width:0 0 2px 2px}.c-br{bottom:-8px;right:-8px;border-width:0 2px 2px 0}
    .artist{font-family:'Space Mono','Courier New',monospace;font-weight:700;font-size:clamp(14px,2.2vw,26px);letter-spacing:.18em;text-transform:uppercase;margin-top:20px;padding:10px 22px;background:var(--red);color:var(--black);display:inline-block;box-shadow:4px 4px 0 var(--bright);animation:fadeUp 1.5s 1s cubic-bezier(.22,1,.36,1) both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .eq{display:flex;align-items:flex-end;gap:4px;height:54px;margin-top:44px;animation:fadeUp 2s 1.2s ease both}
    .eq-bar{width:5px;background:var(--red);border-radius:2px 2px 0 0;box-shadow:0 0 6px rgba(200,0,0,.5);animation:eqBounce var(--dur) var(--dly) ease-in-out infinite alternate}
    @keyframes eqBounce{from{height:4px;opacity:.3}to{height:var(--h);opacity:1}}

    /* TICKER */
    .ticker-wrap{overflow:hidden;background:#080000;padding:10px 0;border-top:1px solid var(--dim);border-bottom:1px solid var(--dim)}
    .ticker{display:flex;white-space:nowrap;animation:scroll 22s linear infinite}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .tick{display:inline-block;padding:0 36px;font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:var(--red);opacity:.75;flex-shrink:0}

    /* KASHMIR BARBED WIRE BAND */
    .wire-wrap{width:100%;background:#060000;padding:4px 0;border-top:1px solid rgba(160,0,0,.4);border-bottom:1px solid rgba(160,0,0,.4);line-height:0;overflow:hidden}
    .wire-wrap canvas{display:block;width:100%;height:60px}
    @media(max-width:760px){.wire-wrap canvas{height:44px}}

    /* MUSIC */
    .music{background:#000;border-top:1px solid rgba(192,0,0,.15)}
    .music-header{padding:48px 40px 36px;display:flex;align-items:baseline;gap:24px;border-bottom:1px solid rgba(192,0,0,.18);flex-wrap:wrap}
    .music-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--red);opacity:.6}
    .music-title{font-size:clamp(28px,5vw,52px);font-weight:700;letter-spacing:.1em}
    .music-ep{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.25);text-transform:uppercase;margin-left:auto;align-self:center}
    .player-grid{display:grid;grid-template-columns:1.5fr 1fr;border-bottom:1px solid rgba(192,0,0,.18)}
    @media(max-width:760px){
      .player-grid{grid-template-columns:1fr}
      .music-header{padding:24px 16px 20px;gap:12px}
      .music-ep{display:none}
      .yt-col{border-right:none}
      .track-item{padding:16px 16px}
      .now-playing-bar{padding:10px 14px}
    }
    .yt-col{display:flex;flex-direction:column;border-right:1px solid rgba(192,0,0,.18)}
    .yt-frame{width:100%;aspect-ratio:16/9;border:none;display:block;background:#000}
    .now-playing-bar{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#080000;border-top:1px solid rgba(192,0,0,.15)}
    .mini-spool{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--red);position:relative;flex-shrink:0;animation:spin 2s linear infinite;box-shadow:0 0 6px rgba(192,0,0,.3)}
    .mini-spool::before{content:'';position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(200,0,0,.4)}
    .mini-spool::after{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--red);opacity:.75}
    @keyframes spin{to{transform:rotate(360deg)}}
    .np-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.3);flex-shrink:0}
    .np-track{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--white);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tracklist-col{display:flex;flex-direction:column}
    .tracklist-head{padding:14px 24px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.45em;text-transform:uppercase;color:var(--red);opacity:.45;border-bottom:1px solid rgba(192,0,0,.12)}
    .track-item{display:flex;align-items:center;gap:16px;padding:20px 24px;cursor:pointer;border-bottom:1px solid rgba(192,0,0,.1);position:relative;overflow:hidden;transition:background .2s}
    .track-item::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red);opacity:0;transition:opacity .2s}
    .track-item:hover{background:rgba(192,0,0,.07)}.track-item:hover::after{opacity:1}
    .track-item.active{background:var(--red)}.track-item.active::after{opacity:0}
    .track-item.active .track-num,.track-item.active .track-title,.track-item.active .track-play{color:#000}
    .track-num{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:rgba(192,0,0,.55);min-width:26px}
    .track-title{font-family:'Space Mono',monospace;font-size:clamp(11px,1.4vw,14px);letter-spacing:.04em;text-transform:uppercase;color:var(--white);flex:1}
    .track-play{font-size:14px;color:rgba(192,0,0,.5);opacity:0;transition:opacity .2s;flex-shrink:0}
    .track-item:hover .track-play,.track-item.active .track-play{opacity:1}
    .viz-wrap{width:100%;height:130px;background:#000;position:relative;overflow:hidden;border-bottom:1px solid rgba(192,0,0,.15)}
    #viz{width:100%;height:100%;display:block}
    .viz-label{position:absolute;bottom:10px;right:16px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(192,0,0,.3)}
    footer{padding:36px 20px;text-align:center;font-size:11px;letter-spacing:.28em;color:rgba(255,255,255,.12);text-transform:uppercase}
  </style>
</head>

/* ============================================================
   KASHMIR BARBED WIRE — canvas, wound-wire + 4-point star barbs
   ============================================================ */
(function(){

  /* Draw a single 4-point star barb (Kashmir style) */
  function drawBarb(ctx, cx, cy, size, angleDeg){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angleDeg * Math.PI / 180);

    /* outer red glow */
    ctx.strokeStyle = 'rgba(255,60,0,0.22)';
    ctx.lineWidth = 9; ctx.lineCap = 'round';
    for(var a=0;a<360;a+=90){
      var r=a*Math.PI/180;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(r)*size,Math.sin(r)*size);ctx.stroke();
    }

    /* solid arms */
    ctx.strokeStyle='#cc1100'; ctx.lineWidth=2.8;
    for(var a=0;a<360;a+=90){
      var r=a*Math.PI/180;
      var ex=Math.cos(r)*size, ey=Math.sin(r)*size;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ex,ey); ctx.stroke();
      /* hook tips — short perpendicular cuts at each tip */
      var hr1=(a+75)*Math.PI/180, hr2=(a-75)*Math.PI/180;
      ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(hr1)*5,ey+Math.sin(hr1)*5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(hr2)*5,ey+Math.sin(hr2)*5);ctx.stroke();
    }

    /* wound wire knot rings */
    ctx.strokeStyle='rgba(255,100,0,0.55)'; ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,4.5,0,Math.PI*2);ctx.stroke();

    /* centre dot */
    ctx.fillStyle='#ff3300';
    ctx.beginPath();ctx.arc(0,0,3.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1a0000';ctx.lineWidth=1.2;ctx.stroke();

    ctx.restore();
  }

  function buildWire(canvas){
    var DPR = window.devicePixelRatio || 1;
    var W = Math.max(canvas.parentElement ? canvas.parentElement.offsetWidth : window.innerWidth, 320);
    var H = canvas.parentElement && window.innerWidth < 761 ? 44 : 60;
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);

    var period=68, amp=14, cy=H/2;

    /* compute main wire path points */
    var pts=[];
    for(var x=0;x<=W;x+=2){
      pts.push({x:x, y:cy + amp*Math.sin((x/period)*Math.PI*2)});
    }

    /* ── glow halo ── */
    ctx.strokeStyle='rgba(160,0,0,0.2)'; ctx.lineWidth=16; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});
    ctx.stroke();

    /* ── dark rope core ── */
    ctx.strokeStyle='#120000'; ctx.lineWidth=6;
    ctx.beginPath();
    pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});
    ctx.stroke();

    /* ── twisted-wire texture: diagonal hatch segments along the path ── */
    for(var i=0;i<pts.length-8;i+=7){
      var p=pts[i], q=pts[Math.min(i+8,pts.length-1)];
      var dx=q.x-p.x, dy=q.y-p.y, len=Math.sqrt(dx*dx+dy*dy)||1;
      var nx=-dy/len*5, ny=dx/len*5;   /* perpendicular offset */
      /* alternating light/dark strands to suggest twist */
      ctx.strokeStyle = (Math.floor(i/7)%2===0) ? '#883300' : '#551100';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(p.x+nx, p.y+ny);
      ctx.lineTo(q.x-nx, q.y-ny);
      ctx.stroke();
    }

    /* ── bright top highlight ── */
    ctx.strokeStyle='#bb2200'; ctx.lineWidth=1.8;
    ctx.beginPath();
    pts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});
    ctx.stroke();

    /* ── second counter strand (crossing wire) ── */
    ctx.strokeStyle='rgba(100,20,0,0.6)'; ctx.lineWidth=1.3;
    ctx.beginPath();
    pts.forEach(function(p,i){
      var y2=cy - amp*0.65*Math.sin(((p.x)/period)*Math.PI*2 + 1.0);
      i===0?ctx.moveTo(p.x,y2):ctx.lineTo(p.x,y2);
    });
    ctx.stroke();

    /* ── BARBS at every half-period, alternating 45° rotations ── */
    var bx=period*0.5, bcount=0;
    while(bx < W){
      var bi=Math.round(bx/2);
      if(bi<pts.length){
        drawBarb(ctx, pts[bi].x, pts[bi].y, 14, bcount%2===0 ? 45 : 0);
        bcount++;
      }
      bx += period*0.5;
    }
  }

  var wTop=document.getElementById('wire-top');
  var wBot=document.getElementById('wire-bottom');
  buildWire(wTop);
  buildWire(wBot);
  wBot.style.transform='scaleY(-1)';
  window.addEventListener('resize',function(){buildWire(wTop);buildWire(wBot);});
})();

/* ============================================================
   RESISTANCE HERO GRAPHICS — Kashmir mountains, fists, birds,
   AZADI text flashes, crowd silhouette, glitch blocks
   ============================================================ */
(function(){
  var cv=document.getElementById('hero-resist');
  var ctx=cv.getContext('2d');
  var W,H,tick=0;
  var fistPulse=0, fistDir=1;
  var birds=[], glitchQ=[], wordQ=[];
  var WORDS=['Revolution','انقلاب','حق','Revolution','انقلاب','حق'];

  function resize(){
    W=cv.width=cv.offsetWidth||window.innerWidth;
    H=cv.height=cv.offsetHeight||window.innerHeight;
  }
  resize(); window.addEventListener('resize',resize);

  /* seed birds */
  for(var i=0;i<20;i++){
    birds.push({
      px:Math.random(), py:0.2+Math.random()*0.6,
      vx:0.00025+Math.random()*0.0004, vy:-(0.00005+Math.random()*0.00015),
      sz:5+Math.random()*11, al:0.08+Math.random()*0.28
    });
  }

  /* ── Mountains ── */
  function drawMountains(){
    /* back range */
    ctx.save(); ctx.globalAlpha=0.09; ctx.fillStyle='#770000';
    ctx.beginPath(); ctx.moveTo(0,H);
    [[.04,.68],[.13,.48],[.22,.62],[.33,.35],[.44,.52],[.55,.28],[.65,.46],[.75,.33],[.85,.55],[.95,.42],[1,.6]].forEach(function(p){ctx.lineTo(p[0]*W,p[1]*H)});
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    /* front range */
    ctx.globalAlpha=0.13; ctx.fillStyle='#440000';
    ctx.beginPath(); ctx.moveTo(0,H);
    [[.02,.84],[.11,.72],[.2,.8],[.3,.63],[.4,.75],[.52,.58],[.62,.7],[.71,.6],[.8,.76],[.9,.67],[1,.8]].forEach(function(p){ctx.lineTo(p[0]*W,p[1]*H)});
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ── Raised Fist ── */
  function drawFist(cx,cy,scale,alpha){
    ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle='#aa0000';
    ctx.translate(cx,cy); ctx.scale(scale,scale);
    /* simplified blocky fist */
    ctx.beginPath();
    ctx.moveTo(-14,30); ctx.lineTo(-16,-2); ctx.lineTo(-13,-20);
    ctx.lineTo(-6,-28); ctx.lineTo(0,-30); ctx.lineTo(6,-28);
    ctx.lineTo(13,-20); ctx.lineTo(16,-2);
    ctx.bezierCurveTo(18,-14,14,-34,0,-34);
    ctx.bezierCurveTo(-14,-34,-18,-14,-16,-2);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(-11,24,22,20); /* wrist */
    ctx.restore();
  }

  /* ── Bird (V-shape) ── */
  function drawBird(x,y,sz,al){
    ctx.save(); ctx.globalAlpha=al; ctx.strokeStyle='#bb1100';
    ctx.lineWidth=Math.max(1,sz*0.16); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x-sz,y+sz*0.38);
    ctx.quadraticCurveTo(x-sz*0.38,y-sz*0.38,x,y);
    ctx.quadraticCurveTo(x+sz*0.38,y-sz*0.38,x+sz,y+sz*0.38);
    ctx.stroke(); ctx.restore();
  }

  /* ── Crescent ── */
  function drawCrescent(x,y,r,al){
    ctx.save(); ctx.globalAlpha=al; ctx.fillStyle='#880000';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#050505';
    ctx.beginPath(); ctx.arc(x+r*0.38,y-r*0.08,r*0.78,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* ── Crowd silhouette ── */
  function drawCrowd(){
    ctx.save(); ctx.globalAlpha=0.07; ctx.fillStyle='#880000';
    var sp=28, hy=H-18, hr=7;
    for(var x=sp/2;x<W;x+=sp){
      var bob=Math.sin(x*0.07+tick*0.6)*2.5;
      ctx.beginPath(); ctx.arc(x,hy-hr+bob,hr,0,Math.PI*2); ctx.fill();
      ctx.fillRect(x-5,hy+bob,10,18);
      /* raised arm on every 3rd */
      if(Math.floor(x/sp)%3===0){
        ctx.fillRect(x-1.5,hy-28+bob,3,16);
        ctx.beginPath(); ctx.arc(x,hy-29+bob,4,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  /* ── Edge barbed wire (vertical, left+right) ── */
  function drawEdgeWires(){
    ctx.save(); ctx.globalAlpha=0.2;
    [22, W-22].forEach(function(ex){
      /* wire strand */
      ctx.strokeStyle='#881100'; ctx.lineWidth=1.5;
      ctx.beginPath();
      for(var y=0;y<=H;y+=3){
        var wx=ex+Math.sin(y*0.12+tick)*5;
        y===0?ctx.moveTo(wx,y):ctx.lineTo(wx,y);
      } ctx.stroke();
      /* barbs */
      ctx.strokeStyle='#cc2200'; ctx.lineWidth=1.8;
      for(var y=35;y<H;y+=50){
        var bx=ex+Math.sin(y*0.12+tick)*5, bs=7;
        ctx.beginPath();ctx.moveTo(bx-bs,y-bs);ctx.lineTo(bx+bs,y+bs);ctx.stroke();
        ctx.beginPath();ctx.moveTo(bx+bs,y-bs);ctx.lineTo(bx-bs,y+bs);ctx.stroke();
        ctx.fillStyle='#ff2200';
        ctx.beginPath();ctx.arc(bx,y,2.5,0,Math.PI*2);ctx.fill();
      }
    });
    ctx.restore();
  }

  /* ── Glitch blocks ── */
  function spawnGlitch(){
    if(Math.random()<0.05){
      glitchQ.push({x:Math.random()*W,y:Math.random()*H,
        w:15+Math.random()*200,h:1.5+Math.random()*12,
        ttl:4+Math.random()*10,
        col:Math.random()<0.65?'rgba(180,0,0,':'rgba(220,220,220,'});
    }
    for(var i=glitchQ.length-1;i>=0;i--){
      var b=glitchQ[i]; b.ttl--;
      if(b.ttl<=0){glitchQ.splice(i,1);continue}
      ctx.fillStyle=b.col+(b.ttl*0.025)+')';
      ctx.fillRect(b.x,b.y,b.w,b.h);
    }
  }

  /* ── Word flashes: AZADI etc ── */
  function spawnWords(){
    if(Math.random()<0.006){
      var maxL=30+Math.random()*50;
      wordQ.push({
        w:WORDS[Math.floor(Math.random()*WORDS.length)],
        x:0.1+Math.random()*0.8, y:0.08+Math.random()*0.78,
        sz:38+Math.random()*90, rot:(Math.random()-.5)*0.45,
        ttl:maxL, maxL:maxL
      });
    }
    wordQ.forEach(function(wf){
      var prog=wf.ttl/wf.maxL;
      var al=(prog<0.3?prog/0.3:prog>0.7?(1-prog)/0.3:1)*0.12;
      ctx.save(); ctx.globalAlpha=al;
      ctx.font='bold '+wf.sz+'px "Oswald",Impact,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#cc0000';
      ctx.translate(wf.x*W,wf.y*H); ctx.rotate(wf.rot);
      ctx.fillText(wf.w,0,0);
      /* glitch offset copy */
      ctx.globalAlpha=al*0.5; ctx.fillStyle='#ff5500';
      ctx.fillText(wf.w,(Math.random()*10-5),0);
      ctx.restore();
      wf.ttl--;
    });
    for(var i=wordQ.length-1;i>=0;i--){if(wordQ[i].ttl<=0)wordQ.splice(i,1)}
  }

  /* ── Main loop ── */
  function frame(){
    tick+=0.016;
    ctx.clearRect(0,0,W,H);
    drawMountains();
    drawCrowd();
    /* pulsing fists */
    fistPulse+=fistDir*0.004;
    if(fistPulse>0.14||fistPulse<0.03) fistDir*=-1;
    drawFist(W*0.83, H*0.58, 1.9, fistPulse);
    drawFist(W*0.13, H*0.52, 1.2, fistPulse*0.65);
    drawFist(W*0.5,  H*0.18, 0.8, fistPulse*0.4);
    /* crescent */
    drawCrescent(W*0.87, H*0.11, 26, 0.07);
    /* birds */
    birds.forEach(function(b){
      b.px+=b.vx; b.py+=b.vy;
      if(b.px>1.06){b.px=-0.06;b.py=0.25+Math.random()*0.5}
      if(b.py<-0.06){b.py=0.15+Math.random()*0.4}
      drawBird(b.px*W, b.py*H, b.sz, b.al);
    });
    spawnGlitch();
    spawnWords();
    drawEdgeWires();
    requestAnimationFrame(frame);
  }
  frame();
})();

/* VISUALIZER */
(function(){
  var cv=document.getElementById('viz'),ctx=cv.getContext('2d');
  var N=90,vals=new Float32Array(N),t=0;
  var phases=Array.from({length:N},function(){return Math.random()*Math.PI*2});
  var speeds=Array.from({length:N},function(){return 0.6+Math.random()*2.2});
  var particles=[];
  function resize(){cv.width=cv.offsetWidth;cv.height=cv.offsetHeight}
  resize();window.addEventListener('resize',resize);
  function lerp(a,b,k){return a+(b-a)*k}
  function frame(){
    t+=0.018;var W=cv.width,H=cv.height;
    for(var i=0;i<N;i++){
      var bass=i<12?0.85:i<30?0.55:0.3;
      vals[i]=lerp(vals[i],Math.min(1,(bass*(Math.sin(t*3.1+i*0.18)*0.35+0.65)+(Math.sin(t*speeds[i]+phases[i])*0.5+0.5)*0.55)*0.95),0.14);
    }
    if(Math.random()<0.4){var pi=Math.floor(Math.random()*N);
      if(vals[pi]>0.72)particles.push({x:((pi+.5)/N)*W,y:H*(1-vals[pi]*.92),vx:(Math.random()-.5)*1.5,vy:-(0.8+Math.random()*2),life:1,r:1+Math.random()*2.5})}
    ctx.clearRect(0,0,W,H);
    ctx.save();ctx.translate(0,H);ctx.scale(1,-0.22);ctx.globalAlpha=0.15;
    for(var i=0;i<N;i++){var h=vals[i]*H*.9,x=(i/N)*W,bw=W/N;
      ctx.fillStyle='rgb('+(180+(vals[i]*70)|0)+','+(vals[i]*vals[i]*60|0)+',0)';ctx.fillRect(x+1,0,bw-2,h)}
    ctx.restore();ctx.globalAlpha=1;
    for(var i=0;i<N;i++){
      var h=vals[i]*H*.92,x=(i/N)*W,bw=W/N,y=H-h;
      var r=(180+(vals[i]*75))|0,g=(vals[i]*vals[i]*80)|0;
      var gr=ctx.createLinearGradient(x,y,x,H);
      gr.addColorStop(0,'rgba('+r+','+g+',0,1)');gr.addColorStop(.6,'rgba('+(r*.7|0)+',0,0,.9)');gr.addColorStop(1,'rgba(70,0,0,.5)');
      ctx.fillStyle=gr;ctx.fillRect(x+1,y,bw-2,h);
      if(h>8){var tp=ctx.createLinearGradient(x,y-14,x,y+2);
        tp.addColorStop(0,'rgba(255,'+Math.min(255,g*3)+',0,0)');tp.addColorStop(1,'rgba(255,'+Math.min(255,g*3)+',0,.75)');
        ctx.fillStyle=tp;ctx.fillRect(x+1,y-14,bw-2,16)}
    }
    ctx.strokeStyle='rgba(255,40,40,.45)';ctx.lineWidth=1.5;ctx.lineJoin='round';
    ctx.beginPath();for(var i=0;i<N;i++){var x=((i+.5)/N)*W,y=H*(1-vals[i]*.92);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
    for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.life-=.025;
      if(p.life<=0){particles.splice(i,1);continue}
      ctx.fillStyle='rgba(255,'+(p.life*80|0)+',0,'+p.life+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
