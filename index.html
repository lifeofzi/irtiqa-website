<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IRTIQA — Ali Saffudin">
  <title>IRTIQA — Ali Saffudin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Mono:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #c00000; --bright: #ff2222; --dim: #600000;
      --black: #050505; --white: #f0f0f0;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black); color: var(--white);
      font-family: 'Oswald', Impact, 'Arial Narrow', sans-serif;
      overflow-x: hidden;
    }

    /* OVERLAYS */
    .scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    }
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 9998;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.8) 100%);
    }

    /* HERO */
    .hero {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 20px 60px; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background: url('./public/cover.jpg') center 30% / cover no-repeat;
      filter: blur(45px) brightness(0.07) saturate(0.2);
      transform: scale(1.18);
    }
    .hero-content {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
    }
    .title-row {
      display: flex; align-items: center; gap: 28px;
      flex-wrap: wrap; justify-content: center;
      animation: fadeDown 1.1s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeDown { from{opacity:0;transform:translateY(-28px)} to{opacity:1;transform:translateY(0)} }
    .title-en {
      font-weight: 700; font-size: clamp(60px,14vw,152px);
      color: var(--red); letter-spacing: 0.07em; line-height: 1;
      text-transform: uppercase; position: relative; display: inline-block;
      text-shadow: 0 0 50px rgba(192,0,0,0.45);
    }
    .g-a,.g-b {
      position: absolute; inset: 0; display: inline-block; width: 100%;
      font-weight: inherit; font-size: inherit; letter-spacing: inherit; text-shadow: none;
    }
    .g-a { color:#ff4444; clip-path:polygon(0 25%,100% 25%,100% 48%,0 48%); animation:ga 5s infinite; }
    .g-b { color:#770000; clip-path:polygon(0 60%,100% 60%,100% 82%,0 82%); animation:gb 5s infinite; }
    @keyframes ga {
      0%,87%,100%{transform:translateX(0);opacity:0}
      89%{transform:translateX(-5px);opacity:1} 91%{transform:translateX(4px);opacity:1}
      93%{transform:translateX(-2px);opacity:1} 95%{transform:translateX(0);opacity:0}
    }
    @keyframes gb {
      0%,80%,100%{transform:translateX(0);opacity:0}
      82%{transform:translateX(6px);opacity:.8} 84%{transform:translateX(-4px);opacity:.8}
      86%{transform:translateX(0);opacity:0}
    }
    .title-ar {
      font-family:'Amiri','Traditional Arabic',serif; font-weight:700;
      font-size:clamp(44px,10vw,108px); color:var(--red); direction:rtl;
      text-shadow:0 0 50px rgba(192,0,0,0.45);
      animation:fadeRight 1.4s 0.4s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
    .hairline {
      width:0; height:1px; margin:28px 0;
      background:linear-gradient(90deg,transparent,var(--red),transparent);
      animation:grow 1.6s .8s ease both;
    }
    @keyframes grow { to{width:140px} }
    .cover-outer { position:relative; animation:riseIn 1.5s .3s cubic-bezier(.22,1,.36,1) both; }
    @keyframes riseIn { from{opacity:0;transform:translateY(50px) scale(.92)} to{opacity:1;transform:translateY(0) scale(1)} }
    .cover-glow {
      position:absolute; inset:-50px; pointer-events:none;
      background:radial-gradient(ellipse,rgba(180,0,0,.38) 0%,transparent 70%);
      animation:glowPulse 3.2s ease-in-out infinite;
    }
    @keyframes glowPulse { 0%,100%{opacity:.5;transform:scale(.96)} 50%{opacity:1;transform:scale(1.04)} }
    .cover-frame { position:relative; padding:2px; background:linear-gradient(135deg,var(--bright),var(--dim),var(--red)); }
    .cover-img { display:block; width:min(360px,80vw); height:min(360px,80vw); object-fit:cover; filter:grayscale(15%) contrast(1.08); }
    .c { position:absolute; width:18px; height:18px; border-color:var(--bright); border-style:solid; }
    .c-tl{top:-8px;left:-8px;border-width:2px 0 0 2px} .c-tr{top:-8px;right:-8px;border-width:2px 2px 0 0}
    .c-bl{bottom:-8px;left:-8px;border-width:0 0 2px 2px} .c-br{bottom:-8px;right:-8px;border-width:0 2px 2px 0}
    .artist {
      font-family:'Space Mono','Courier New',monospace; font-weight:700;
      font-size:clamp(14px,2.2vw,26px); letter-spacing:.18em; text-transform:uppercase;
      margin-top:20px; padding:10px 22px;
      background:var(--red); color:var(--black); display:inline-block;
      box-shadow:4px 4px 0 var(--bright);
      animation:fadeUp 1.5s 1s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    .eq { display:flex; align-items:flex-end; gap:4px; height:54px; margin-top:44px; animation:fadeUp 2s 1.2s ease both; }
    .eq-bar {
      width:5px; background:var(--red); border-radius:2px 2px 0 0;
      box-shadow:0 0 6px rgba(200,0,0,.5);
      animation:eqBounce var(--dur) var(--dly) ease-in-out infinite alternate;
    }
    @keyframes eqBounce { from{height:4px;opacity:.3} to{height:var(--h);opacity:1} }

    /* TICKER */
    .ticker-wrap {
      overflow:hidden; background:#080000; padding:10px 0;
      border-top:1px solid var(--dim); border-bottom:1px solid var(--dim);
    }
    .ticker { display:flex; white-space:nowrap; animation:scroll 22s linear infinite; }
    @keyframes scroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
    .tick { display:inline-block; padding:0 36px; font-size:11px; letter-spacing:.38em; text-transform:uppercase; color:var(--red); opacity:.75; flex-shrink:0; }

    /* BARBED WIRE */
    .wire-wrap {
      width:100%; background:#0a0000; line-height:0;
      padding: 8px 0;
      border-top: 1px solid rgba(180,0,0,0.4);
      border-bottom: 1px solid rgba(180,0,0,0.4);
    }
    .wire-wrap svg { width:100%; height:60px; display:block; overflow:visible; }

    /* MUSIC SECTION */
    .music { background:#000; border-top:1px solid rgba(192,0,0,.15); }
    .music-header {
      padding:48px 40px 36px; display:flex; align-items:baseline;
      gap:24px; border-bottom:1px solid rgba(192,0,0,.18); flex-wrap:wrap;
    }
    .music-tag {
      font-family:'Space Mono',monospace; font-size:10px;
      letter-spacing:.5em; text-transform:uppercase; color:var(--red); opacity:.6;
    }
    .music-title { font-size:clamp(28px,5vw,52px); font-weight:700; letter-spacing:.1em; }
    .music-ep {
      font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.08em;
      color:rgba(255,255,255,.25); text-transform:uppercase; margin-left:auto; align-self:center;
    }

    /* Player grid */
    .player-grid {
      display:grid; grid-template-columns:1.5fr 1fr;
      border-bottom:1px solid rgba(192,0,0,.18);
    }
    @media(max-width:760px) {
      .player-grid{grid-template-columns:1fr}
      .music-header{padding:32px 20px 24px}
    }
    .yt-col { display:flex; flex-direction:column; border-right:1px solid rgba(192,0,0,.18); }
    .yt-frame { width:100%; aspect-ratio:16/9; border:none; display:block; background:#000; }
    .now-playing-bar {
      display:flex; align-items:center; gap:14px; padding:14px 20px;
      background:#080000; border-top:1px solid rgba(192,0,0,.15);
    }
    .mini-spool {
      width:26px; height:26px; border-radius:50%;
      border:1.5px solid var(--red); position:relative; flex-shrink:0;
      animation:spin 2s linear infinite; box-shadow:0 0 6px rgba(192,0,0,.3);
    }
    .mini-spool::before { content:''; position:absolute; inset:5px; border-radius:50%; border:1px solid rgba(200,0,0,.4); }
    .mini-spool::after  { content:''; position:absolute; inset:9px; border-radius:50%; background:var(--red); opacity:.75; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .np-label { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.3); flex-shrink:0; }
    .np-track { font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--white); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* Tracklist */
    .tracklist-col { display:flex; flex-direction:column; }
    .tracklist-head {
      padding:14px 24px; font-family:'Space Mono',monospace;
      font-size:9px; letter-spacing:.45em; text-transform:uppercase;
      color:var(--red); opacity:.45; border-bottom:1px solid rgba(192,0,0,.12);
    }
    .track-item {
      display:flex; align-items:center; gap:16px; padding:20px 24px;
      cursor:pointer; border-bottom:1px solid rgba(192,0,0,.1);
      position:relative; overflow:hidden; transition:background .2s;
    }
    .track-item::after {
      content:''; position:absolute; left:0; top:0; bottom:0; width:2px;
      background:var(--red); opacity:0; transition:opacity .2s;
    }
    .track-item:hover { background:rgba(192,0,0,.07); }
    .track-item:hover::after { opacity:1; }
    .track-item.active { background:var(--red); }
    .track-item.active::after { opacity:0; }
    .track-item.active .track-num,
    .track-item.active .track-title,
    .track-item.active .track-play { color:#000; }
    .track-num { font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:rgba(192,0,0,.55); min-width:26px; }
    .track-title { font-family:'Space Mono',monospace; font-size:clamp(11px,1.4vw,14px); letter-spacing:.04em; text-transform:uppercase; color:var(--white); flex:1; }
    .track-play { font-size:14px; color:rgba(192,0,0,.5); opacity:0; transition:opacity .2s; flex-shrink:0; }
    .track-item:hover .track-play { opacity:1; }
    .track-item.active .track-play { opacity:1; }

    /* Visualizer */
    .viz-wrap {
      width:100%; height:130px; background:#000;
      position:relative; overflow:hidden;
      border-bottom:1px solid rgba(192,0,0,.15);
    }
    #viz { width:100%; height:100%; display:block; }
    .viz-label {
      position:absolute; bottom:10px; right:16px;
      font-family:'Space Mono',monospace; font-size:9px;
      letter-spacing:.3em; text-transform:uppercase; color:rgba(192,0,0,.3);
    }

    /* FOOTER */
    footer {
      padding:36px 20px; text-align:center; font-size:11px;
      letter-spacing:.28em; color:rgba(255,255,255,.12); text-transform:uppercase;
    }
  </style>
</head>

<script>
// Grain
(function(){
  var SIZE=256,cv=document.createElement('canvas');
  cv.width=cv.height=SIZE;
  var ctx=cv.getContext('2d'),layer=document.createElement('div');
  layer.style.cssText='position:fixed;inset:0;opacity:.045;pointer-events:none;z-index:9997;background-repeat:repeat';
  document.body.appendChild(layer);
  function tick(){
    var img=ctx.createImageData(SIZE,SIZE),d=img.data;
    for(var i=0;i<d.length;i+=4){var v=(Math.random()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
    ctx.putImageData(img,0,0);
    layer.style.backgroundImage='url('+cv.toDataURL()+')';
    setTimeout(tick,80);
  }
  tick();
})();

// Equalizer
(function(){
  var eq=document.getElementById('eq');
  for(var i=0;i<24;i++){
    var b=document.createElement('div');
    b.className='eq-bar';
    var h=(14+Math.random()*38).toFixed(0),dur=(0.22+Math.random()*.7).toFixed(2),dly=(-Math.random()).toFixed(2);
    b.style.cssText='--h:'+h+'px;--dur:'+dur+'s;--dly:'+dly+'s';
    eq.appendChild(b);
  }
})();

// Ticker
(function(){
  var t=document.getElementById('ticker');
  var words=['IRTIQA','ارتقا','Ali Saffudin','◆','IRTIQA','ارتقا','Ali Saffudin','◆'];
  words.concat(words).forEach(function(w){
    var s=document.createElement('span');s.className='tick';s.textContent=w;t.appendChild(s);
  });
})();

// VHS flicker
(function(){
  function flicker(){
    var v=(0.82+Math.random()*.22).toFixed(2);
    document.body.style.filter='brightness('+v+')';
    setTimeout(function(){
      document.body.style.filter='';
      setTimeout(flicker,3500+Math.random()*8000);
    },40+Math.random()*130);
  }
  setTimeout(flicker,2000+Math.random()*3000);
})();

// Track switching
(function(){
  var PLAYLIST='OLAK5uy_nJXx8GmUS2W2ZBhwWxJrofuE_j3VbgWP0';
  var player=document.getElementById('yt-player');
  var npTrack=document.getElementById('np-track');
  var tracks=document.querySelectorAll('.track-item');
  tracks.forEach(function(item){
    item.addEventListener('click',function(){
      tracks.forEach(function(t){t.classList.remove('active');});
      item.classList.add('active');
      npTrack.textContent=item.dataset.title;
      player.src='https://www.youtube.com/embed/'+item.dataset.vid+'?list='+PLAYLIST+'&autoplay=1&rel=0&modestbranding=1&color=red';
    });
  });
})();

// Canvas Visualizer
(function(){
  var canvas=document.getElementById('viz');
  var ctx=canvas.getContext('2d');
  var N=90,vals=new Float32Array(N),t=0;
  var phases=Array.from({length:N},function(){return Math.random()*Math.PI*2;});
  var speeds=Array.from({length:N},function(){return 0.6+Math.random()*2.2;});
  var particles=[];

  function resize(){
    canvas.width=canvas.offsetWidth;
    canvas.height=canvas.offsetHeight;
  }
  resize();
  window.addEventListener('resize',resize);

  function lerp(a,b,k){return a+(b-a)*k;}

  function frame(){
    t+=0.018;
    var W=canvas.width,H=canvas.height;

    for(var i=0;i<N;i++){
      var bass=i<12?0.85:i<30?0.55:0.3;
      var beat=Math.sin(t*3.1+i*0.18)*0.35+0.65;
      var wave=Math.sin(t*speeds[i]+phases[i])*0.5+0.5;
      var target=Math.min(1,(bass*beat+wave*0.55)*0.95);
      vals[i]=lerp(vals[i],target,0.14);
    }

    if(Math.random()<0.4){
      var pi=Math.floor(Math.random()*N);
      if(vals[pi]>0.72){
        particles.push({
          x:((pi+0.5)/N)*W, y:H*(1-vals[pi]*0.92),
          vx:(Math.random()-0.5)*1.5, vy:-(0.8+Math.random()*2),
          life:1, r:1+Math.random()*2.5
        });
      }
    }

    ctx.clearRect(0,0,W,H);

    // Mirror reflection
    ctx.save();
    ctx.translate(0,H); ctx.scale(1,-0.22); ctx.globalAlpha=0.15;
    for(var i=0;i<N;i++){
      var h=vals[i]*H*0.9,x=(i/N)*W,bw=W/N;
      var r=(180+(vals[i]*70))|0,g=(vals[i]*vals[i]*60)|0;
      ctx.fillStyle='rgb('+r+','+g+',0)';
      ctx.fillRect(x+1,0,bw-2,h);
    }
    ctx.restore(); ctx.globalAlpha=1;

    // Bars
    for(var i=0;i<N;i++){
      var h=vals[i]*H*0.92,x=(i/N)*W,bw=W/N,y=H-h;
      var r=(180+(vals[i]*75))|0,g=(vals[i]*vals[i]*80)|0;
      var grad=ctx.createLinearGradient(x,y,x,H);
      grad.addColorStop(0,'rgba('+r+','+g+',0,1)');
      grad.addColorStop(0.6,'rgba('+(r*.7|0)+',0,0,.9)');
      grad.addColorStop(1,'rgba(70,0,0,.5)');
      ctx.fillStyle=grad;
      ctx.fillRect(x+1,y,bw-2,h);
      if(h>8){
        var tip=ctx.createLinearGradient(x,y-14,x,y+2);
        tip.addColorStop(0,'rgba(255,'+Math.min(255,g*3)+',0,0)');
        tip.addColorStop(1,'rgba(255,'+Math.min(255,g*3)+',0,.75)');
        ctx.fillStyle=tip;
        ctx.fillRect(x+1,y-14,bw-2,16);
      }
    }

    // Waveform line
    ctx.strokeStyle='rgba(255,40,40,.45)'; ctx.lineWidth=1.5; ctx.lineJoin='round';
    ctx.beginPath();
    for(var i=0;i<N;i++){
      var x=((i+0.5)/N)*W,y=H*(1-vals[i]*0.92);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();

    // Particles
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.life-=0.025;
      if(p.life<=0){particles.splice(i,1);continue;}
      ctx.fillStyle='rgba(255,'+(p.life*80|0)+',0,'+p.life+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  frame();
})();

// Barbed Wire
(function(){
  var NS='http://www.w3.org/2000/svg';
  function mk(tag,attrs){
    var el=document.createElementNS(NS,tag);
    for(var k in attrs)el.setAttribute(k,attrs[k]);
    return el;
  }
  function buildWire(container,flip){
    var W=Math.max(window.innerWidth||0,1440),H=30,cy=15,period=38,amp=7;
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','none');
    svg.style.cssText='width:100%;height:30px;display:block;'+(flip?'transform:scaleY(-1)':'');
    var d1='',d2='';
    for(var x=0;x<=W;x+=3){
      var y1=cy+amp*Math.sin((x/period)*Math.PI*2);
      var y2=cy-amp*Math.sin((x/period)*Math.PI*2);
      d1+=(x===0?'M':'L')+' '+x.toFixed(1)+' '+y1.toFixed(1)+' ';
      d2+=(x===0?'M':'L')+' '+x.toFixed(1)+' '+y2.toFixed(1)+' ';
    }
    svg.appendChild(mk('path',{d:d1,stroke:'#880000','stroke-width':'1.8',fill:'none'}));
    svg.appendChild(mk('path',{d:d2,stroke:'#550000','stroke-width':'1.8',fill:'none'}));
    for(var x=period*0.5;x<W;x+=period*0.5){
      var bx=Math.round(x),s=5.5;
      svg.appendChild(mk('line',{x1:bx-s,y1:cy-s,x2:bx+s,y2:cy+s,stroke:'#cc0000','stroke-width':'2.5','stroke-linecap':'round'}));
      svg.appendChild(mk('line',{x1:bx+s,y1:cy-s,x2:bx-s,y2:cy+s,stroke:'#cc0000','stroke-width':'2.5','stroke-linecap':'round'}));
      svg.appendChild(mk('circle',{cx:bx,cy:cy,r:'2',fill:'#ff2222'}));
    }
    container.appendChild(svg);
  }
  buildWire(document.getElementById('wire-top'),false);
  buildWire(document.getElementById('wire-bottom'),true);
})();
</script>
</body>
</html>
