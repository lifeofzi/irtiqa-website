name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */5 * *'  # every 5 days at 8am UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ihvcifupnviosunafwhe.supabase.co/rest/v1/inventory?select=product_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -gt 299 ]; then
            echo "Unexpected status — check if project is paused"
            exit 1
          fi
